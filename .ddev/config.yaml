name: ara
type: generic
docroot: ""
webserver_type: nginx-fpm
nodejs_version: "22.14.0"
corepack_enable: true

# Même version qu'en production (voir .upsun/config.yaml)
database:
  type: postgres
  version: "16"

# Les deux serveurs de dev tournent en tâche de fond dans le conteneur web.
# nginx (voir .ddev/nginx_full/nginx-site.conf) les expose sur https://ara.ddev.site
web_extra_daemons:
  - name: "api"
    command: "yarn dev:back"
    directory: /var/www/html
  - name: "front"
    command: "yarn dev:front"
    directory: /var/www/html

# Cypress cible http://localhost:3000 en dur (cypress/support/commands.ts) :
# le port est exposé côté hôte, et "localhost" est déclaré comme FQDN pour que
# le routeur (Traefik) accepte l'en-tête Host correspondant.
additional_fqdns:
  - localhost

web_extra_exposed_ports:
  - name: vite
    container_port: 3000
    http_port: 3000
    https_port: 3443

web_environment:
  - DATABASE_URL=postgres://db:db@db:5432/db
  - DATABASE_SSL=false
  - FRONT_BASE_URL=https://ara.ddev.site
  - JWT_SECRET=ddev-local-dev-secret
  - DEBUG_ENDPOINTS=1
  # Mailpit, fourni par DDEV dans le conteneur web (pas d'authentification SMTP).
  # 127.0.0.1 et non "localhost" : Nodemailer résout les noms d'hôte via le DNS
  # de Docker, qui ne renvoie pas la loopback du conteneur.
  - MAILER_SMTP_HOST=127.0.0.1
  - MAILER_SMTP_PORT=1025
  - MAILER_SMTP_SECURE=false
  - MAILER_USER=ara@ddev.site
  - MAILER_PASSWORD=ddev
  # Magasin d'objets Garage (voir .ddev/docker-compose.garage.yaml).
  # Service interne : jamais joint depuis le navigateur.
  - S3_ENDPOINT=http://garage:3900
  - S3_REGION=garage
  - S3_BUCKET=ara
  - AWS_ACCESS_KEY_ID=ara-local-access-key
  - AWS_SECRET_ACCESS_KEY=ara-local-secret-key
  # Valeurs factices : le formulaire de retour d'expérience (Grist) reste
  # non fonctionnel en local, faute d'identifiants.
  - GRIST_API_KEY=ddev
  - GRIST_DOC_ID=ddev
  - GRIST_TABLE_ID=ddev
  # Permet à Node de faire confiance au CA mkcert de DDEV
  - NODE_EXTRA_CA_CERTS=/mnt/ddev-global-cache/mkcert/rootCA.pem

hooks:
  post-start:
    - exec: "test -d node_modules || yarn install"
    - exec: "test -f confiture-rest-api/dist/main.js || yarn workspace confiture-rest-api run build"
    - exec: "yarn workspace confiture-rest-api run prisma migrate deploy"
    # web_extra_daemons démarre AVANT les hooks : sur une installation neuve les
    # serveurs se lancent sans node_modules ni dist. On les relance une fois que
    # les dépendances sont installées et la base à jour.
    - exec: "supervisorctl restart 'webextradaemons:*'"
