# Ara — reverse-proxy vers les deux serveurs de dev lancés par web_extra_daemons :
#   - Vite (front) : 127.0.0.1:3000
#   - NestJS (API) : 127.0.0.1:4000
#
# Fichier repris à la main : le marqueur de génération automatique de DDEV en a
# été retiré, DDEV ne l'écrase donc plus au démarrage. Ne pas le réintroduire,
# même à l'intérieur d'un commentaire.

server {
    listen 80 default_server;
    listen 443 ssl default_server;

    root /var/www/html;

    ssl_certificate /etc/ssl/certs/master.crt;
    ssl_certificate_key /etc/ssl/certs/master.key;

    include /etc/nginx/monitoring.conf;

    sendfile off;
    error_log /dev/stdout info;
    access_log /var/log/nginx/access.log;

    # Uploads d'images et exports (xlsx/docx) : la limite nginx par défaut est trop basse
    client_max_body_size 100m;

    # API NestJS : préfixe global "/api", proxy "/uploads" et documentation Swagger
    location ~ ^/(api|uploads|swagger) {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Front Vite (SPA + websocket HMR)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Laisse passer l'upgrade websocket du client HMR de Vite
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    include /etc/nginx/common.d/*.conf;
    include /mnt/ddev_config/nginx/*.conf;
}
